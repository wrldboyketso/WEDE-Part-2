<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maka Nana Shisanyama - Home</title>
    <link rel="stylesheet" href="css/style.css?v=20260914-6">
</head>
<body>
    <header class="site-header">
        <a class="brand-logo" href="home.html"><img src="images/maka-nana-logo.png" alt="Maka Nana Shisanyama"></a>
        <nav class="site-nav">
            <a href="home.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="header-actions">
            <a class="account-link" href="register.html">Sign in/up</a>
            <a class="cart-link" href="cart.html">Cart <span class="cart-count">0</span></a>
        </div>
    </header>

    <main>
        <section class="hero">
            <h2>Fresh from the fire</h2>
            <img src="images/maka-nana-banner.jpeg" alt="Maka Nana Shisanyama">
            <p>Fresh, tasty shisanyama near Spar in Durban.</p>
            <a class="btn" href="menu.html">See the menu</a>
        </section>

        <section class="cards">
            <h2>Popular Dishes</h2>
            <article>
                <img src="images/food-source/pictures/pictures/Beef%20meat%20with%20wors%20and%20salad%20COMBO.jpeg" alt="Beef combo">
                <h3>Beef, Wors &amp; Salad Combo</h3>
                <p class="price">R120</p>
                <button class="add-to-cart" data-name="Beef Wors Salad Combo" data-price="120">Add to cart</button>
            </article>
            <article>
                <img src="images/food-source/pictures/pictures/Chicken%20Drumstick%20with%20Chips%20(fries)%20COMBO.jpeg" alt="Chicken combo">
                <h3>Chicken Drumstick &amp; Chips Combo</h3>
                <p class="price">R90</p>
                <button class="add-to-cart" data-name="Chicken Drumstick Chips Combo" data-price="90">Add to cart</button>
            </article>
            <article>
                <img src="images/food-source/pictures/pictures/Pap%20with%20Chicken%20meat,%20wors%20and%20chips%20COMBO.jpeg" alt="Pap combo">
                <h3>Pap, Chicken, Wors &amp; Chips Combo</h3>
                <p class="price">R140</p>
                <button class="add-to-cart" data-name="Pap Chicken Wors Chips Combo" data-price="140">Add to cart</button>
            </article>
        </section>
    </main>

    <footer><p>Phone / WhatsApp: +27 71 840 5670</p></footer>
    <script src="js/script.js?v=20260914-3"></script>
</body>
</html>
